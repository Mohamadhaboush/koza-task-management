version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: koza_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: proje_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koza_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:password123@db:5432/proje_db
      JWT_SECRET: myaccessecretkey123
      JWT_EXPIRES_IN: 1d
    depends_on:
      - db
  frontend:
    build: ../intern-task-management-frontend
    container_name: koza_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: